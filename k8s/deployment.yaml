apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
data:
  PYTHONPATH: "/app"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline
  labels:
    app: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline
  template:
    metadata:
      labels:
        app: pipeline
    spec:
      containers:
      - name: pipeline
        image: pipline:latest
        imagePullPolicy: Never
        env:
        - name: PYTHONPATH
          value: "/app"
        volumeMounts:
        - name: output
          mountPath: /app/output
      volumes:
      - name: output
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline
spec:
  selector:
    app: pipeline
  ports:
  - port: 8000
    targetPort: 8000
  type: NodePort
